# profile-patch-snippet.yml
# 手动合并用：把下面这段追加到 DSH profile 的 cordis.patch.yml 末尾。
# 注意把 command / args 里的路径替换为本机的 node.exe 与 @playwright/mcp cli.js 实际路径
# （运行 install.ps1 会自动生成，无需手动）。

- insert:
    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: 'C:/path/to/node.exe'
        args:
          - 'C:/path/to/node_modules/@playwright/mcp/cli.js'
          - '--browser'
          - 'chrome'
